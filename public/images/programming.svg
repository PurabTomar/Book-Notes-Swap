<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2735"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect x="150" y="100" width="500" height="340" rx="14" fill="#161b22"/>
  <g>
    <circle cx="185" cy="128" r="7" fill="#ff5f56"/><circle cx="208" cy="128" r="7" fill="#ffbd2e"/><circle cx="231" cy="128" r="7" fill="#27c93f"/>
  </g>
  <g font-family="Consolas, monospace" font-size="26" fill="#79b8ff">
    <text x="180" y="190">int is_available(Book *b) {</text>
    <text x="210" y="225" fill="#85e89d">  return b-&gt;status == AVAILABLE;</text>
    <text x="180" y="260">}</text>
    <text x="180" y="300" fill="#79c0ff">void swap(Student *a, Student *b) {</text>
    <text x="210" y="335" fill="#ff7b72">  exchange_resources(a, b);</text>
    <text x="180" y="370">}</text>
  </g>
  <text x="400" y="500" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="bold">PROGRAMMING &amp; ALGORITHMS</text>
</svg>